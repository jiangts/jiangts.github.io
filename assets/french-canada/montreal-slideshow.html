<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Montreal Trip Slideshow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css">
  <style>
    :root {
      --ink: #f6f7ef;
      --muted: #c7d2d9;
      --line: rgba(255,255,255,.18);
      --accent: #f0c04f;
      --blue: #62c2d3;
      --green: #91c96d;
      --red: #ee7668;
    }
    body { background: #101417; }
    .reveal { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
    .reveal .slides { text-align: left; }
    .reveal h1, .reveal h2, .reveal h3 { letter-spacing: 0; text-transform: none; line-height: 1.02; }
    .reveal h1 { font-size: 1.75em; max-width: 900px; }
    .reveal h2 { font-size: .64em; margin: 0; }
    .reveal p, .reveal li { font-size: .36em; line-height: 1.35; }
    .title-slide {
      min-height: 72vh;
      display: grid;
      align-content: end;
      padding: 0 5vw 5vh;
      background: var(--hero) center / cover;
      border-radius: 8px;
      overflow: hidden;
    }
    .title-slide .deck-label { color: var(--accent); font-weight: 800; font-size: .3em; text-transform: uppercase; letter-spacing: .12em; }
    .title-slide .sub { max-width: 790px; color: var(--muted); }
    .title-copy {
      width: fit-content;
      max-width: 860px;
      padding: 7px 9px;
      border-radius: 8px;
      background: rgba(0,0,0,.38);
    }
    .place-slide {
      position: relative;
      min-height: 72vh;
      overflow: hidden;
      border-radius: 8px;
      background: #151b1f;
    }
    .photo-stack {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1.35fr .8fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
    }
    .photo-stack img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #263036;
      filter: saturate(1.05) contrast(1.02);
    }
    .photo-stack img:first-child { grid-row: 1 / -1; }
    .text-panel {
      position: absolute;
      left: 34px;
      bottom: 34px;
      z-index: 2;
      display: grid;
      align-content: end;
      width: min(48%, 520px);
      padding: 9px 11px;
      background: rgba(0,0,0,.36);
      border-radius: 8px;
    }
    .pitch {
      margin: 0;
      max-width: 500px;
      color: var(--ink);
      font-size: .43em;
      font-weight: 750;
      line-height: 1.18;
    }
    .text-panel .pitch { margin-top: 9px; }
    .theme-slide {
      min-height: 72vh;
      display: grid;
      align-content: end;
      padding: 0 5vw 5vh;
      border-radius: 8px;
      overflow: hidden;
      background: var(--hero) center / cover;
    }
    .theme-slide .deck-label {
      color: var(--accent);
      font-weight: 800;
      font-size: .3em;
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .theme-slide .theme-copy {
      width: min(860px, 86vw);
      padding: 7px 9px;
      border-radius: 8px;
      background: rgba(0,0,0,.34);
    }
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
      max-width: 900px;
    }
    .lens {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      color: var(--muted);
      font-size: .32em;
      line-height: 1.28;
    }
    .lens strong { color: var(--ink); }
    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-top: 26px;
    }
    .summary div { border-top: 1px solid var(--line); padding-top: 15px; }
    @media (max-width: 820px) {
      .place-slide { min-height: 76vh; }
      .photo-stack { grid-template-columns: 1fr; opacity: .78; }
      .photo-stack img:first-child { grid-row: auto; }
      .photo-stack img:nth-child(n+2) { display: none; }
      .text-panel {
        left: 22px;
        right: 22px;
        bottom: 22px;
        width: auto;
        padding: 8px 10px;
      }
      .theme-grid { grid-template-columns: 1fr; }
      .summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
